name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Unit and integration tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Compile Python
        run: python -m compileall -q src infra scripts
      - name: Validate shell syntax
        run: >-
          bash -n
          deploy/tak-ili-inache-admin
          deploy/tak-ili-inache-upgrade-wrapper
          deploy/tak-ili-inache-backup
          deploy/tak-ili-inache-prune-releases
          infra/tak-ili-inache-infra-admin
          infra/tak-ili-inache-backup-run
          infra/tak-ili-inache-backup-freshness-run
          infra/tak-ili-inache-alloy-run
